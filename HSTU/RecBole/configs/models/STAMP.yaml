# Env
checkpoint_dir: /data/group_data/cx_group/REC/checkpoints
log_wandb: True 
wandb_project: RecSys-Benchmark 
show_progress: True
save_dataset: False
save_dataloaders: False

# Training 
epochs: 50
train_batch_size: 512
learner: adam
# weight_decay: 1e-4
learning_rate: 0.0005
loss_type: CE
train_neg_sample_args:
stopping_step: 10 # default 10 for ml, 50 for others 
eval_step: 1
# threshold: {'rating': 3}
# normalize_field: ~
# normalize_all: True
clip_grad_norm:
  max_norm: 110  # Specify the gradient clipping max norm
  norm_type: 2   # Optional, defaults to L2 norm

# Model 
model: STAMP
embedding_size: 100
# hidden_size: 100
# reg_weight: 2                     # (int) The L2 regularization weight.
# dropout_prob: 0.3                 # (float) The dropout rate.
LABEL_FIELD: rating

